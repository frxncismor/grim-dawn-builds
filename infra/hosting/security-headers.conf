# Security headers declared for the served web artifact (T-166)
#
# STATUS: NOT ACTIVE. Hosting is deferred (T-045): the site is only served
# locally by `scripts/serve-artifact.mts` during E2E, Lighthouse and DAST
# runs. This file declares the exact header set that the future host must
# send; it is a reference for the eventual CDN/server configuration, not a
# configuration that anything loads today.
#
# Source of truth: `scripts/serve-artifact.mts` adds these headers to every
# response. Keep both in sync: `pnpm test:scripts` fails if the server stops
# sending a set that differs from what this file declares (see
# `scripts/serve-artifact.test.mts`).
#
# The Content-Security-Policy allows the prerendered Angular HTML without
# `unsafe-inline`/`unsafe-eval`: inline <script> and <style> blocks are
# permitted only by their SHA-256 hash. Angular's critical-CSS inliner adds
# one `onload="this.media='all'"` handler; inline handlers can only be
# allowed by hash with CSP3's `unsafe-hashes`, and `script-src-attr` limits
# that permission to exactly the handlers present in the page.
#
# Hashes are per page: the artifact is prerendered per locale and route, so
# the policy must be generated from the HTML that is actually served.
# Regenerate it for a given file with:
#
#   node --import tsx scripts/serve-artifact.mts --print-headers dist/grim-dawn-builds/browser/index.html
#
# Replace <HASHES> below with the hashes printed for each HTML file, or have
# the host compute them at deploy time from the artifact. Never replace them
# with 'unsafe-inline'.

X-Frame-Options: DENY
X-Content-Type-Options: nosniff
Referrer-Policy: strict-origin-when-cross-origin
Permissions-Policy: camera=(), geolocation=(), microphone=(), payment=(), usb=()
Content-Security-Policy: default-src 'self'; script-src 'self' <SCRIPTS>; script-src-attr 'none'; style-src 'self' <STYLES>; img-src 'self'; frame-src https://www.youtube-nocookie.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'

# Non-HTML responses (JS, CSS, fonts, JSON, XML) use the same policy without
# hashes and with `script-src-attr 'none'`; `Cache-Control: no-store` is a
# property of the local/DAST server and stays out of the hosting contract.
#
# Pages that carry Angular's critical-CSS inliner use this variant instead,
# with the hash of every handler served:
#
#   Content-Security-Policy: ... script-src-attr 'unsafe-hashes' <HANDLER_HASHES>; ...
