# Local stack for the read-only API (T-056). Run from the repository root:
#   pnpm setup:env                       # creates infra/docker/.env and secrets/ (git-ignored)
#   docker compose -f infra/docker/compose.yaml up -d --wait
#
# Rules (plan §12.7, §12.8; constitution XII):
# - db is NOT published to the host. Debug access is opt-in via compose.debug.yaml (loopback only).
# - api is published only on 127.0.0.1.
# - Secrets are read from git-ignored files through per-service Compose `secrets:` and *_FILE
#   variables. No literal secret value or shared env_file appears in this file.
# - On a fresh volume, db's entrypoint hook creates NOLOGIN roles and enables only migrator and
#   api_ro from their secret files before migrate connects. importer/editor remain NOLOGIN.
# - Existing volumes can rerun the same idempotent hook with `pnpm exec tsx
#   infra/docker/init/provision-roles.mts`; it never removes data or prints secret values.

name: grim-dawn-builds

x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  db:
    # PostgreSQL 17.11 (Debian trixie), tag and multi-arch index digest resolved from Docker Hub /
    # registry-1.docker.io on 2026-11-09. Never `latest`.
    image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    # stderr keeps diagnostics visible in Docker Desktop and `docker compose logs db`.
    # SQLSTATE and session metadata help correlate failures without dumping SQL/bind values.
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - "log_line_prefix=%m [%p] sqlstate=%e user=%u db=%d app=%a client=%r session=%c "
      - -c
      - log_timezone=UTC
      - -c
      - log_min_messages=warning
      - -c
      - log_error_verbosity=terse
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_duration=off
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    <<: *hardening
    # The official entrypoint starts as root to initialise PGDATA, then drops to the postgres user.
    # Only the capabilities that step needs are added back after cap_drop ALL.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gd_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - db_password_migrator
      - db_password_api_ro
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql --no-psqlrc -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc
          "SELECT count(*) = 2 AND bool_and(rolcanlogin) FROM pg_roles WHERE rolname IN
          ('migrator', 'api_ro')" | grep -qx t
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: gd-api:local
    <<: *hardening
    # T-057: migrator entrypoint is not implemented yet (apps/api/src/db/migrate.mts). Credentials for
    # the `migrator` role arrive with T-056b. Do not run migrations any other way.
    command: ["node", "dist/db/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gd_dev}
      DB_HOST: db
      DB_USER_MIGRATOR: migrator
      DB_PASSWORD_MIGRATOR_FILE: /run/secrets/db_password_migrator
    secrets:
      - db_password_migrator
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: gd-api:local
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gd_dev}
      DB_HOST: db
      DB_USER_API_RO: api_ro
      CORS_ORIGINS: ${CORS_ORIGINS-http://localhost:4200}
      API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES-16384}
      API_RATE_LIMIT: ${API_RATE_LIMIT-120}
      DB_PASSWORD_API_RO_FILE: /run/secrets/db_password_api_ro
    secrets:
      - db_password_api_ro
    # Host side is loopback only. Inside the container the image sets API_HOST=0.0.0.0 so the
    # published port can reach the process.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_password_migrator:
    file: ./secrets/db_password_migrator.txt
  db_password_api_ro:
    file: ./secrets/db_password_api_ro.txt

volumes:
  pgdata:
    name: grim-dawn-builds-pgdata
