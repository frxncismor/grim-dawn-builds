# PR verification (T-064, plan §12.8 / §13.4).
# Free checks only: no deployment, no secrets, read-only token.
# Runs on pull_request into mvp/1, develop and main. Never pull_request_target.
# Static rules for this file are enforced by scripts/ci-workflow.test.mts.
name: CI

on:
  pull_request:
    branches:
      - mvp/1
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-24.04
    # T-126: the e2e, axe and Lighthouse gates add minutes; 30 is not enough.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NG_CLI_ANALYTICS: 'false'
      CONTENT_SOURCE: fixture
      INCLUDE_DRAFTS: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secret scan needs the PR base commit (commit range).
          fetch-depth: 0
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check scope
        run: pnpm run check:scope

      - name: Check monorepo boundaries
        run: pnpm run check:boundaries

      - name: Check tracked secrets
        run: pnpm run check:secrets

      # T-086: fails if a workflow leaks secrets via set -x, compose config with values,
      # env artifacts or secrets in fork-reachable jobs.
      - name: Check CI workflows for secrets
        run: pnpm exec tsx scripts/check-ci-secrets.mts

      # gitleaks (T-083): release tarball pinned by version and SHA-256, verified before use.
      # No token, no secrets and no third-party action are needed for the CLI.
      - name: Install gitleaks (pinned, SHA-256 verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Diff of this PR only: commits in base..head (read-only, redacted output).
      - name: Secret scan (PR commit range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Domain build
        run: pnpm --filter @gd/domain build

      - name: Domain typecheck
        run: pnpm --filter @gd/domain typecheck

      - name: Domain lint
        run: pnpm --filter @gd/domain lint

      - name: Domain tests
        run: pnpm --filter @gd/domain test

      - name: API typecheck
        run: pnpm --filter @gd/api typecheck

      - name: API lint
        run: pnpm --filter @gd/api lint

      # The integration suite never pulls images on its own: it fails closed when
      # the pinned PostgreSQL digest is missing. CI pulls the exact digest from
      # Compose so the test image and the local one can never drift.
      - name: Pull pinned PostgreSQL fixture image
        run: |
          image="$(sed -nE 's/^[[:space:]]+image:[[:space:]]+(postgres:[^[:space:]]+)$/\1/p' infra/docker/compose.yaml | head -n1)"
          test -n "$image" || { echo "No pinned postgres image found in compose.yaml"; exit 1; }
          case "$image" in
            *@sha256:*) ;;
            *) echo "PostgreSQL image is not pinned by digest: $image"; exit 1 ;;
          esac
          echo "Pulling $image"
          docker pull "$image"

      - name: API tests
        run: pnpm --filter @gd/api test

      # T-065: backend CI without deployment. Compose must resolve with the
      # example env file (no real secrets), and the image must build from the
      # monorepo root without being pushed anywhere.
      - name: Compose configuration check
        run: docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yaml config --quiet

      - name: Build API image (no push)
        run: docker build --file apps/api/Dockerfile --tag gd-api:ci .

      - name: API image runs as non-root
        run: test "$(docker run --rm gd-api:ci id -u)" != "0"

      - name: Web lint
        run: pnpm run lint

      # Check only: this job never runs markdownlint --fix.
      - name: Markdown lint
        run: pnpm run lint:md

      - name: Format check
        run: pnpm run format:check

      - name: Web unit tests
        run: pnpm run test

      - name: Script tests
        run: pnpm run test:scripts

      # Fixture dataset only: content/builds is not populated yet (T-014).
      # The invalid fixture is covered by the script tests above.
      - name: Content validation (fixture)
        run: pnpm run content:validate -- --dir scripts/fixtures/content-valid

      # `content/` is the repository's real fixture content (content/builds is
      # still empty until T-014). `catalog:check` fails if the generated catalog
      # drifts from the content it is generated from.
      - name: Content validation (real fixture content)
        run: pnpm run content:validate -- --dir content

      - name: Catalog check (generated catalog is current)
        run: pnpm run catalog:check

      # T-150: the en/es catalogs must match; verify-local.mjs already runs it.
      - name: Locale parity (en/es catalogs match)
        run: pnpm run check:locale-parity

      - name: Assets check
        run: pnpm run assets:check

      - name: Web build (fixture content)
        run: pnpm run build

      # The local drafts artifact is built into its own directory
      # (dist/e2e-drafts) and never overwrites the public dist/grim-dawn-builds;
      # playwright.config.ts serves both on different ports (4321 and 4322).
      - name: Build drafts artifact (isolated directory, no overwrite)
        env:
          INCLUDE_DRAFTS: 'true'
        run: pnpm exec ng build --output-path dist/e2e-drafts

      - name: Install Playwright Chromium (pinned by package.json)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E journeys (public and drafts artifacts, 3 viewports)
        run: pnpm run e2e:journeys

      - name: Accessibility gate (axe, 3 routes x 3 viewports, negative fixture)
        run: pnpm run e2e:a11y

      # dist/build-info.json is exclusive to `build:release` (T-074): a PR build
      # must not claim a release source. Otherwise report the effective content
      # source only (no secrets, no environment dump).
      - name: Artifact source report (fixture build, no release report)
        run: |
          set -euo pipefail
          if [ -f dist/build-info.json ]; then
            echo "PR build must not produce dist/build-info.json (release-only, T-074)"
            exit 1
          fi
          echo "Effective content source: CONTENT_SOURCE=${CONTENT_SOURCE:-fixture}"
          echo "No release report is produced by a PR build (fixture artifact)."

      # Decides on the median of the configured numberOfRuns in lighthouserc.json,
      # measures the real `pnpm build` artifact (never `ng serve`), and Chrome is
      # preinstalled on the ubuntu-24.04 image.
      - name: Performance budgets (Lighthouse median + byte budgets)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm run check:performance

  # T-066b: container configuration and image scan. Own job id (`container`) so the DAST
  # job added later keeps its own name and scope. No deployment, no secrets, read-only
  # token and the built image is never pushed.
  container:
    name: Container configuration and image scan
    runs-on: ubuntu-24.04
    # Build, archive export and Trivy scan of the API image fit well within this budget.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Static rules (T-066b): final image USER non-root, no .env*/secrets/ copied, no
      # literal secrets in ARG/ENV and no db ports in the default Compose.
      - name: Container configuration check
        run: pnpm run check-container

      # The default Compose must resolve with the example env file (no real secrets).
      - name: Compose configuration check (container job)
        run: docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yaml config --quiet

      - name: Build API image for scanning (no push)
        run: docker build --file apps/api/Dockerfile --tag gd-api:ci-scan .

      # Trivy reads an image archive: the Docker socket is never mounted in this job.
      - name: Export image archive for Trivy
        run: docker save --output "$RUNNER_TEMP/gd-api-ci-scan.tar" gd-api:ci-scan

      # Trivy pinned by version and multi-arch index digest (Docker Hub, 2026-11-11) so a
      # mutable tag cannot change the gate between runs.
      # Default exit code 0 so the JSON is always written; the MEDIUM threshold is decided
      # by check-container below (single source of truth for the gate). No --ignore-unfixed
      # and no allowlist: findings are never silently ignored.
      - name: Scan image with Trivy (JSON export, no push)
        run: docker run --rm -v "$RUNNER_TEMP:/scan" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /scan/gd-api-ci-scan.tar --format json --output /scan/trivy-image.json --scanners vuln --severity MEDIUM,HIGH,CRITICAL

      # Blocks on any MEDIUM/HIGH/CRITICAL finding; exits 2 (fail closed) on an empty or
      # malformed report instead of passing.
      - name: Evaluate Trivy report (MEDIUM blocks)
        run: pnpm exec tsx scripts/check-container.mts --report "$RUNNER_TEMP/trivy-image.json"

  # T-077: dynamic application security testing (DAST) in PR. Free OWASP ZAP baseline
  # against the web artifact and the API started on the runner, with an ephemeral
  # PostgreSQL and loopback-only targets: no secrets, no remote targets, read-only
  # token. The gate is scripts/check-dast.mts (MEDIUM blocks, no allowlist).
  dast:
    name: DAST baseline (ZAP, local web and API)
    runs-on: ubuntu-24.04
    # Install, build, ephemeral database, three ZAP baselines and the threshold check.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NG_CLI_ANALYTICS: 'false'
      CONTENT_SOURCE: fixture
      # Loopback targets only; scripts/check-ci-secrets.mts verifies this statically.
      DAST_WEB_URL: http://127.0.0.1:8081
      DAST_API_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Domain build
        run: pnpm --filter @gd/domain build

      # Same public artifact the verify job measures: fixture content, static files.
      - name: Web build (fixture content)
        run: pnpm run build

      - name: API build
        run: pnpm --filter @gd/api build

      # Ephemeral, per-job credential: generated here, masked in the log and kept in
      # $RUNNER_TEMP. It never reaches a remote service and is discarded with the runner.
      - name: Generate ephemeral database credentials
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          umask 077
          echo "::add-mask::${password}" && printf '%s' "$password" > "$RUNNER_TEMP/dast-db-password"

      # The same pinned PostgreSQL 17 image the integration tests use. Published on
      # loopback only; the database is discarded with the ephemeral container.
      - name: Start PostgreSQL 17 (pinned, loopback only)
        run: |
          set -euo pipefail
          image="$(sed -nE 's/^[[:space:]]+image:[[:space:]]+(postgres:[^[:space:]]+)$/\1/p' infra/docker/compose.yaml | head -n1)"
          case "$image" in
            *@sha256:*) ;;
            *) echo "PostgreSQL image is not pinned by digest: $image"; exit 1 ;;
          esac
          docker run --detach --rm --name gd-dast-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=gd_dast \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/dast-db-password \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=256m \
            --tmpfs /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m \
            --mount "type=bind,source=$RUNNER_TEMP/dast-db-password,target=/run/secrets/dast-db-password,readonly" \
            "$image"
          for attempt in $(seq 1 60); do
            if docker exec gd-dast-db pg_isready --quiet --username postgres --dbname gd_dast; then
              echo "PostgreSQL listo en loopback"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL no arrancó en 120 s"
          exit 1

      # migrations/0001 creates missing roles, but that needs CREATEROLE: the four roles
      # are provisioned first as the local superuser, exactly like Compose does. psql
      # reads the password from the mounted secret file with `\set` backticks, so the
      # value never appears in a command line or in this workflow.
      - name: Provision restricted database roles
        run: |
          set -euo pipefail
          printf '%s\n' \
            'CREATE ROLE migrator NOLOGIN;' \
            'CREATE ROLE importer NOLOGIN;' \
            'CREATE ROLE editor NOLOGIN;' \
            'CREATE ROLE api_ro NOLOGIN;' \
            '\set migrator_password `cat /run/secrets/dast-db-password`' \
            '\set api_ro_password `cat /run/secrets/dast-db-password`' \
            "ALTER ROLE migrator LOGIN PASSWORD :'migrator_password';" \
            "ALTER ROLE api_ro LOGIN PASSWORD :'api_ro_password';" \
            'GRANT CREATE ON DATABASE gd_dast TO migrator;' \
            'GRANT USAGE, CREATE ON SCHEMA public TO migrator;' \
            | docker exec --interactive gd-dast-db psql --username postgres --dbname gd_dast --set ON_ERROR_STOP=1 --quiet

      - name: Apply migrations with the migrator role
        run: |
          set -euo pipefail
          DB_HOST=127.0.0.1 DB_PORT=5432 POSTGRES_DB=gd_dast DB_USER_MIGRATOR=migrator \
            DB_PASSWORD_MIGRATOR="$(cat "$RUNNER_TEMP/dast-db-password")" \
            node apps/api/dist/db/migrate.mjs

      # Python's http.server is preinstalled on the runner and serves the built artifact
      # as a generic static host would (no security headers are invented here: a
      # functional CSP for the inline Angular bootstrap is a separate build task).
      - name: Serve web artifact and start API (loopback only)
        run: |
          set -euo pipefail
          python3 -m http.server 8081 --bind 127.0.0.1 --directory dist/grim-dawn-builds/browser > "$RUNNER_TEMP/dast-web.log" 2>&1 &
          DB_HOST=127.0.0.1 DB_PORT=5432 POSTGRES_DB=gd_dast DB_USER_API_RO=api_ro \
            DB_PASSWORD_API_RO="$(cat "$RUNNER_TEMP/dast-db-password")" \
            API_HOST=127.0.0.1 API_PORT=3000 \
            node apps/api/dist/server.js > "$RUNNER_TEMP/dast-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --output /dev/null http://127.0.0.1:8081/ &&
              curl --silent --show-error --fail --output /dev/null http://127.0.0.1:3000/health &&
              curl --silent --show-error --fail --output /dev/null http://127.0.0.1:3000/ready; then
              echo "web y API listos en loopback"
              exit 0
            fi
            sleep 2
          done
          echo "web o API no arrancaron en 120 s"
          exit 1

      # ZAP image pinned by version and multi-arch index digest (2026-11-11) so the
      # scanner cannot change between runs. `--network host` lets the container reach the
      # loopback targets; the image runs as the unprivileged `zap` user, so the report
      # directory is world-writable. No -c/-u/-i/-I: a rules file could hide alerts.
      - name: ZAP baseline against the web artifact (loopback)
        run: |
          set -euo pipefail
          install -d -m 0777 "$RUNNER_TEMP/zap"
          status=0
          docker run --rm --network host --volume "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab zap-baseline.py -t http://127.0.0.1:8081/ -m 1 -P 8090 -J dast-web.json -r dast-web.html > "$RUNNER_TEMP/dast-zap-web.log" 2>&1 || status=$?
          case "$status" in
            0|1|2) echo "ZAP web terminó con estado $status; el umbral lo decide check-dast" ;;
            *) echo "ZAP web falló con estado $status"; exit 1 ;;
          esac

      # Same baseline against the two API entry points: the public content endpoint and
      # the liveness probe.
      - name: ZAP baseline against the API (loopback)
        run: |
          set -euo pipefail
          install -d -m 0777 "$RUNNER_TEMP/zap"
          status=0
          docker run --rm --network host --volume "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab zap-baseline.py -t http://127.0.0.1:3000/api/v1/builds -m 1 -P 8090 -J dast-api-builds.json -r dast-api-builds.html > "$RUNNER_TEMP/dast-zap-api-builds.log" 2>&1 || status=$?
          case "$status" in
            0|1|2) echo "ZAP API builds terminó con estado $status; el umbral lo decide check-dast" ;;
            *) echo "ZAP API builds falló con estado $status"; exit 1 ;;
          esac
          status=0
          docker run --rm --network host --volume "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab zap-baseline.py -t http://127.0.0.1:3000/health -m 1 -P 8090 -J dast-api-health.json -r dast-api-health.html > "$RUNNER_TEMP/dast-zap-api-health.log" 2>&1 || status=$?
          case "$status" in
            0|1|2) echo "ZAP API health terminó con estado $status; el umbral lo decide check-dast" ;;
            *) echo "ZAP API health falló con estado $status"; exit 1 ;;
          esac

      # Single decision point: any MEDIUM/HIGH/CRITICAL alert fails the job; exit 2 (fail
      # closed) on an empty or malformed report. Output names rule, risk, redacted URL and
      # count only: no headers, bodies, cookies or target values. The raw ZAP reports stay
      # in $RUNNER_TEMP and are never uploaded as artifacts.
      - name: Evaluate ZAP reports (MEDIUM blocks)
        run: pnpm exec tsx scripts/check-dast.mts --report "$RUNNER_TEMP/zap/dast-web.json" --report "$RUNNER_TEMP/zap/dast-api-builds.json" --report "$RUNNER_TEMP/zap/dast-api-health.json"
