# spec005 T017 (US8, FR-034): generates the visual-regression references on Linux. Manual only.
# It builds the `own` artifact, runs `pnpm e2e:visual:update` and uploads the PNGs as a workflow
# artifact; a person downloads them and commits them (see CONTRIBUTING.md). It never pushes.
# Static rules for this file are enforced by scripts/ci-workflow.test.mts.
name: Visual baselines (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Generate visual references (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NG_CLI_ANALYTICS: 'false'
      CONTENT_SOURCE: fixture
      INCLUDE_DRAFTS: 'false'
      ASSET_SOURCE: own
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Domain build
        run: pnpm --filter @gd/domain build

      - name: Web build (own assets, fixture content)
        run: pnpm run build

      - name: Install Playwright Chromium (pinned by package.json)
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate references
        run: pnpm run e2e:visual:update

      - name: Upload references (download and commit them by hand)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: e2e/visual-baselines
          retention-days: 14
          if-no-files-found: error
