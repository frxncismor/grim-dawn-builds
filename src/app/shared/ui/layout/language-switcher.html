<nav class="lang-switch" aria-label="Language" i18n-aria-label="@@locale.navLabel">
  <a
    [href]="englishHref()"
    hreflang="en"
    lang="en"
    [attr.aria-current]="current === 'en' ? 'true' : null"
    i18n="@@locale.english"
    >English</a
  >
  <a
    [href]="spanishHref()"
    hreflang="es"
    lang="es"
    [attr.aria-current]="current === 'es' ? 'true' : null"
    i18n="@@locale.spanish"
    >Español</a
  >
</nav>
