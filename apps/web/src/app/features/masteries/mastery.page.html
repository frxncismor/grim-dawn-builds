@if (tree; as page) {
  <article class="mastery">
    <header class="mastery__header">
      <p class="mastery__eyebrow" i18n="@@mastery.eyebrow">Mastery skill tree</p>
      <h1>{{ name }}</h1>
      <p class="mastery__summary" i18n="@@mastery.summary">
        {{ nodeCount }} skills across nine tiers. Each skill shows its tier, the mastery bar points
        it needs, its ranks and the skill it requires.
      </p>
      <p class="mastery__version">
        <span i18n="@@mastery.version">Game version:</span> {{ page.game_version }}
      </p>
    </header>
    <gd-skill-tree [treeId]="'mastery-' + page.mastery.slug" [catalogTree]="page" />
    <p>
      <a routerLink="/tier-list" i18n="@@mastery.backToCatalog">Browse the build catalog</a>
    </p>
  </article>
} @else {
  <gd-not-found-page />
}
